name: JARVIS APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub'ın Ubuntu sunucusunda Android SDK hazır kurulu (ANDROID_HOME)
      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: JS sözdizimi kontrolü
        run: |
          node --check www/app.js
          grep -q 'plug("Jarvis")' www/app.js || (echo "Yerel eklenti adı bozulmuş" && exit 1)
          node -e "const s=require('./www/skills.json'); if(s.length<360) process.exit(1); console.log(s.length+' yetenek')"
      - name: Sürüm numarasını göm (otomatik güncelleme için)
        run: sed -i "s/__RUN__/${{ github.run_number }}/" www/app.js
      - name: Bağımlılıklar
        run: npm ci

      - name: Web dosyalarını Android'e kopyala
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK'yı Releases'e koy (telefondan tek dokunuşla indir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="v${VER}-${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "JARVIS-${VER}.apk"
          gh release create "$TAG" "JARVIS-${VER}.apk" --title "JARVIS ${VER} (derleme ${{ github.run_number }})" --notes "Telefona indir, kur. Önceki sürümün üstüne kurulabilir; verilerin silinmez." --latest
