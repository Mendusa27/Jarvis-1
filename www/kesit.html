<style>
/* Layout: editor console — library | preview | inspector over a full-width timeline; on phones the side panels become bottom sheets */
:root{
  --bg:#101218; --panel:#161920; --panel2:#1d212a; --line:#2a2f3a; --line2:#363c49;
  --fg:#e9e6df; --mute:#8d929e; --accent:#f2a33a; --accent-ink:#1b1305; --danger:#e5484d; --marker:#5fb4ff;
  --c-video:#36557a; --c-image:#3f6d68; --c-color:#6a5638; --c-text:#7d4a6b; --c-sub:#46607e; --c-audio:#2c6a58; --c-shape:#5b4a86;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --head:84px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:13px;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  grid-template-columns:288px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto auto minmax(190px,36%);
  grid-template-areas:"top top top" "media prev insp" "media trans insp" "tools tools tools" "tl tl tl";background:var(--bg)}
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line);min-width:0}
.logo{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:7px;white-space:nowrap}
.logo i{display:inline-block;width:14px;height:14px;background:var(--accent);clip-path:polygon(0 0,100% 0,62% 100%,0 100%)}
#pname{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 7px;min-width:0;flex:1;max-width:220px;font-weight:500}
#pname:hover,#pname:focus{border-color:var(--line2);background:var(--panel)}
#saveState{font-size:11px;color:var(--mute);white-space:nowrap}
.sp{flex:1}
.sel{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 11px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--mute)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{padding:5px 8px;font-size:12px}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.btn.wide{width:100%}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:7px;color:var(--fg);flex:none}
.ib:hover:not(:disabled){background:var(--panel2)}
.ib.on{color:var(--accent)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden;z-index:-1}
/* panels */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#media{grid-area:media;border-right:1px solid var(--line)}
#insp{grid-area:insp;border-left:1px solid var(--line)}
.sheet-h{display:none}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}

.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.note{font-size:12px;color:var(--mute);line-height:1.45}
.banner{background:color-mix(in srgb,var(--accent) 12%,var(--panel2));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.45;display:flex;flex-direction:column;gap:7px}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.mlist{display:flex;flex-direction:column;gap:6px}
.mi{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:8px;background:var(--panel2)}
.mi .th{width:64px;height:38px;border-radius:5px;background:var(--line) center/cover no-repeat;display:grid;place-items:center;color:var(--mute)}
.mi .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mi .meta{font-size:11px;color:var(--mute);font-family:var(--f-mono)}

.star.on{color:var(--accent)}.star.on svg{fill:var(--accent)}

.tc .pv{height:52px;border-radius:5px;display:grid;place-items:center;overflow:hidden;background:#0b0c10;color:#fff;font-size:10px;text-align:center;padding:4px}

.tc span{font-size:11px;color:var(--mute);line-height:1.35}
.hero-card{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--panel2)),var(--panel2));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.hero-card b{font-family:var(--f-display);font-size:13px}
.hero-card span{font-size:12px;color:var(--mute)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.gbtn:hover{border-color:var(--accent)}
.gbtn svg{width:22px;height:22px}
.emo{font-size:22px;line-height:1;padding:8px 0}
.subrow,.mkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:start}
.subrow .tm,.mkrow .tm{font-family:var(--f-mono);font-size:11px;color:var(--mute);padding-top:6px;cursor:pointer;background:none}
.subrow textarea,.mkrow input{width:100%;resize:vertical;min-height:32px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 7px}
.logo-pv{height:64px;border-radius:8px;background:repeating-conic-gradient(#2a2e38 0 25%,#22252d 0 50%) 0 0/16px 16px;display:grid;place-items:center;overflow:hidden}
.logo-pv img{max-height:52px;max-width:90%}
/* preview */
#prev{grid-area:prev;display:grid;place-items:center;min-height:0;min-width:0;padding:12px;background:radial-gradient(ellipse at center,#14171e,var(--bg))}
#stage{position:relative;max-width:100%;max-height:100%}
#cv{display:block;background:#000;box-shadow:0 0 0 1px var(--line2),0 12px 40px rgba(0,0,0,.45);touch-action:none}
#stageTag{position:absolute;top:6px;left:6px;font-family:var(--f-mono);font-size:10px;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;color:#ddd;pointer-events:none}
#trans{grid-area:trans;display:flex;align-items:center;justify-content:center;gap:4px;padding-block:6px;border-top:1px solid var(--line)}
.tc-time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;min-width:84px}
.tc-time.r{text-align:right;color:var(--mute)}
#playBtn{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
#playBtn svg{width:18px;height:18px}
#tools{grid-area:tools;display:flex;align-items:center;gap:4px;padding-block:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.vsep{width:1px;height:22px;background:var(--line2);margin:0 4px;flex:none}
#zoom{width:120px;accent-color:var(--accent)}
.lbl{font-size:11px;color:var(--mute)}
/* timeline */
#tl{grid-area:tl;min-height:0;position:relative;background:var(--bg)}
#tlScroll{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain}
#tlInner{position:relative;min-height:100%}
.row{display:flex;border-bottom:1px solid var(--line)}
.head{position:sticky;left:0;z-index:4;width:var(--head);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 6px;font-size:11px}
.head b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .hb{display:flex}
.head .ib{width:24px;height:20px}
.head svg.i{width:14px;height:14px}
.lane{position:relative;flex:1}
.row.ruler{position:sticky;top:0;z-index:5;height:26px;background:var(--panel)}
.row.ruler .head{z-index:6;font-family:var(--f-mono);color:var(--mute);font-size:10px}
.row.ruler .lane{cursor:ew-resize;touch-action:none}
.tick{position:absolute;bottom:0;height:7px;border-left:1px solid var(--line2)}
.tick.maj{height:12px;border-color:var(--mute)}
.tick span{position:absolute;left:3px;bottom:9px;font-family:var(--f-mono);font-size:9.5px;color:var(--mute);white-space:nowrap}
.mk{position:absolute;top:0;width:10px;height:12px;margin-left:-5px;background:var(--marker);clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);pointer-events:none}
.beat{position:absolute;bottom:0;width:2px;margin-left:-1px;height:5px;background:var(--accent);opacity:.8;pointer-events:none}
.clip{position:absolute;top:3px;bottom:3px;border-radius:5px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid rgba(255,255,255,.12);display:flex;align-items:flex-start}
.clip .bgth{position:absolute;inset:0;background-repeat:repeat-x;background-size:auto 100%;opacity:.55}
.clip .cl{position:relative;padding:2px 6px;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:100%}
.clip canvas.wf{position:absolute;left:0;bottom:0;height:55%;width:100%;opacity:.8;pointer-events:none}
.clip.sel{border:2px solid var(--accent);z-index:2}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize;display:none;background:var(--accent)}
.clip .hl{left:0;border-radius:3px 0 0 3px}.clip .hr{right:0;border-radius:0 3px 3px 0}
.clip.sel .hl,.clip.sel .hr{display:block}
.clip .kfd{position:absolute;bottom:2px;width:7px;height:7px;background:var(--accent);transform:translateX(-50%) rotate(45deg);pointer-events:none}
.clip .xin{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.clip.miss{background:repeating-linear-gradient(45deg,#4a2226 0 6px,#3a1a1e 6px 12px)!important}
.k-adjust{background:repeating-linear-gradient(135deg,#5a4a1e 0 8px,#4d3f19 8px 16px)}.k-video{background:var(--c-video)}.k-image{background:var(--c-image)}.k-color{background:var(--c-color)}.k-text{background:var(--c-text)}.k-sub{background:var(--c-sub)}.k-audio{background:var(--c-audio)}.k-shape{background:var(--c-shape)}
.trk-off .lane{opacity:.45}
#ph{position:absolute;top:0;bottom:0;width:0;z-index:3;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--accent)}
#ph::after{content:"";position:absolute;top:0;left:-6px;width:12px;height:14px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.snapln{position:absolute;top:0;bottom:0;width:1px;background:#fff;z-index:3;pointer-events:none;opacity:.7}
/* inspector */
.ih{display:flex;align-items:center;gap:8px;padding:10px 10px 0}
.ih .chip{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--mute)}
.ih b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{display:flex;flex-direction:column;gap:9px}
.grp h4{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);font-weight:600}
.fld{display:grid;grid-template-columns:78px minmax(0,1fr) 46px 22px;gap:6px;align-items:center}
.fld.nk{grid-template-columns:78px minmax(0,1fr) 46px}
.fld label{color:var(--mute);font-size:12px}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.fld .v{font-family:var(--f-mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.kf{width:22px;height:22px;display:grid;place-items:center;color:var(--mute)}
.kf svg{width:12px;height:12px}
.kf.on{color:var(--accent)}.kf.on svg{fill:var(--accent)}
.row2{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px;align-items:center}
.row2 label{color:var(--mute);font-size:12px}
.row2 select,.row2 input[type=text],.row2 input[type=email]{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 7px;min-width:0}

.seg{display:flex;flex-wrap:wrap;gap:4px}

.sw{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.35}
.sw input{accent-color:var(--accent);width:16px;height:16px;flex:none}
#mnav{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 10px;border-radius:16px;background:var(--panel2);border:1px solid var(--line2);white-space:nowrap;font-size:12px;flex:none}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip small{color:var(--mute);font-size:10.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.modal .pgrid{max-height:46vh;overflow:auto;align-content:start}
.pbtn{padding:9px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;text-align:center;min-height:42px;line-height:1.25}
.pbtn:hover{border-color:var(--mute)}
.pbtn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,6,9,.72);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px;width:min(440px,calc(100vw - 32px));min-width:0;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal.wide{width:min(760px,calc(100vw - 32px))}
.modal h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.modal video{width:100%;border-radius:8px;background:#000;max-height:40vh}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cmp video{max-height:46vh}
.pick{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.pickrow{display:grid;grid-template-columns:auto 52px minmax(0,1fr);gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:6px}
.pickrow .th{width:52px;height:32px;border-radius:4px;background:var(--line) center/cover}
.pickrow input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 6px;min-width:0}
.pickrow small{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results{display:flex;flex-direction:column;gap:8px}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#menu{position:fixed;z-index:40;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:5px;display:flex;flex-direction:column;min-width:220px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#menu button{text-align:left;padding:8px 10px;border-radius:6px}
#menu button:hover{background:var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;z-index:80;max-width:calc(100% - 32px);font-size:13px;text-align:center}
.dropzone-on::after{content:"Dosyaları bırak";position:fixed;inset:10px;border:2px dashed var(--accent);border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;background:rgba(16,18,24,.8);z-index:70}
/* self-tape studio */
#studio{position:fixed;inset:0;z-index:45;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"sh sh" "cam side" "ctl side";
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.sth{grid-area:sh;display:flex;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.sth b{font-family:var(--f-display);font-size:15px}
.camwrap{grid-area:cam;position:relative;display:grid;place-items:center;background:#000;min-height:0;overflow:hidden;border-radius:10px;margin-top:10px}
#camv{max-width:100%;max-height:100%;display:block}
.cammsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#ddd;line-height:1.5;font-size:14px}
.cd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:min(30vw,170px);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}
.recdot{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;border-radius:20px;padding:3px 10px;font-weight:600;font-family:var(--f-mono);font-size:12px}
.reader{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(10,11,14,.78);color:#fff;border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.4;border:2px solid transparent;cursor:pointer}
.reader .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:2px}

/* ================= playback sync ================= */
function sync(){
  const t=S.t;let speak=false;
  if(S.settings.duck){for(const c of S.clips){if(c.kind!=='media')continue;const tr=trk(c.track);if(!tr||tr.music||tr.muted||c.vol<0.05)continue;const m=med(c.mediaId);if(!m||m.kind==='image'||!m.rms)continue;
    if(t>=c.start&&t<cend(c)&&rmsAt(m,c.in+(t-c.start)*c.speed)>0.0126){speak=true;break}}}
  const tgt=speak?0.25:1;S.duckG+=(tgt-S.duckG)*(tgt<S.duckG?0.25:0.05);
  for(const c of S.clips){
    if(c.kind!=='media')continue;const m=med(c.mediaId);if(!m||m.kind==='image'||!m.url)continue;
    const e=getEl(c);if(!e)continue;const el=e.el;const tr=trk(c.track);if(!tr)continue;
    const we=winEnd(c),L=len(c);const active=t>=c.start&&t<we;let gain=0;
    if(active){
      const srcT=Math.min(c.in+(t-c.start)*c.speed,(m.dur||1e9)-0.04);
      gain=c.vol*fadeEnv(c,Math.min(t-c.start,L))*(tr.muted?0:1);
      if(t>c.start+L)gain*=clamp(1-(t-cend(c))/(we-cend(c)),0,1);
      if(t-c.start<c.tin.dur&&overlapIn(c)>0)gain*=clamp((t-c.start)/c.tin.dur,0,1);
      if(tr.music)gain*=S.duckG;
      if(S.playing){
        if(el.paused){el.currentTime=srcT;el.playbackRate=c.speed;const p=el.play();if(p&&p.catch)p.catch(()=>{})}
        else{if(el.playbackRate!==c.speed)el.playbackRate=c.speed;if(Math.abs(el.currentTime-srcT)>0.3&&!el.seeking)el.currentTime=srcT}
      }else{if(!el.paused)el.pause();if(!el.seeking&&Math.abs(el.currentTime-srcT)>0.02)el.currentTime=srcT}
    }else{
      if(!el.paused)el.pause();
      const d=c.start-t;if(d>0&&d<1.5&&!el.seeking&&Math.abs(el.currentTime-c.in)>0.05)el.currentTime=c.in;
    }
    if(e.g){e.g.gain.value=gain;setEq(e,c)}else el.volume=clamp(gain,0,1);
  }
}

function fxFilter(list,P,str){if(!list||!list.length)return'';let f='';for(const e of list){const F=FX[e.t];const a=clamp(e.a/100,0,1)*str;if(F&&F.f&&a>0.001)f+=' '+F.f(a,P)}return f}
function runFx(list,W,H,P,st,str){
  if(!list||!list.length)return;const items=[];for(const e of list){const F=FX[e.t];const a=clamp(e.a/100,0,1)*str;if(F&&a>0.001)items.push({F,a})}if(!items.length)return;
  lctx.setTransform(1,0,0,1,0,0);lctx.filter='none';lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';
  if(items.some(x=>x.F.px)){const im=lctx.getImageData(0,0,W,H),d=im.data;for(const x of items)if(x.F.px)x.F.px(d,x.F.src?new Uint8ClampedArray(d):null,W,H,x.a,P);lctx.putImageData(im,0,0)}
  for(const x of items)if(x.F.w){snapLC(W,H);lctx.save();lctx.clearRect(0,0,W,H);x.F.w(lctx,W,H,x.a,P);lctx.restore()}
  for(const x of items)if(x.F.ov){lctx.save();x.F.ov(lctx,W,H,x.a,P);lctx.restore()}
  for(const x of items)if(x.F.post)x.F.post(st,x.a,P);
}

let DEC=null;
async function importFiles(files,opts={}){
  const list=[...files];if(!list.length)return[];let relinked=0,added=0;const out=[];
  for(const f of list){
    const kind=f.type.startsWith('video')?'video':f.type.startsWith('audio')?'audio':f.type.startsWith('image')?'image':(/\.(mp4|mov|webm|mkv|m4v|3gp|avi|qt)$/i.test(f.name)?'video':/\.(mp3|wav|m4a|aac|ogg|flac|opus)$/i.test(f.name)?'audio':/\.(png|jpe?g|gif|webp|heic)$/i.test(f.name)?'image':null);
    if(!kind){toast(`${f.name} desteklenmeyen bir dosya türü`,4000);continue}
    if(!opts.quiet)toast(`${f.name} yükleniyor…`,20000);
    const miss=S.media.find(m=>!m.url&&m.name===f.name&&m.kind===kind);
    const m=miss||{id:uid(),name:f.name,kind,dur:0};m.file=f;m.url=URL.createObjectURL(f);
    if(opts.take){m.take=true;m.n=nextTakeN();m.scene=opts.scene||'Sahne';m.star=false}
    if(!miss)S.media.push(m);
    try{await probe(m,opts.durHint)}catch(e){toast(`${f.name} açılamadı. Bu tarayıcı dosyanın biçimini çözemiyor olabilir; Chrome ya da Safari ile dene.`,6000);if(!miss)S.media=S.media.filter(x=>x!==m);renderMedia();continue}
    idbPutFile(m);
    if(miss)relinked++;
    else if(!opts.take&&!opts.noAdd){if(S.sample)clearSample(true);
      addMedia(m,null,opts);added++}
    out.push(m);renderMedia();analyze(m);
  }
  if(relinked){cleanEls();renderTimeline();dirty=true;toast(`${relinked} dosya yeniden bağlandı`)}
  else if(added)toast(`${added} dosya zaman çizelgesine eklendi`);
  else if(out.length&&opts.take&&!opts.quiet)toast(`${out.length} çekim eklendi`);
  else if(out.length&&!opts.quiet)$('#toast').hidden=true;
  return out;
}
function probe(m,durHint){return new Promise((res,rej)=>{
  if(m.kind==='image'){const im=new Image();im.onload=()=>{m.w=im.naturalWidth;m.h=im.naturalHeight;m.img=im;try{const c=document.createElement('canvas');c.width=160;c.height=Math.round(160*m.h/m.w);c.getContext('2d').drawImage(im,0,0,c.width,c.height);m.thumb=c.toDataURL('image/jpeg',0.7)}catch(_){m.thumb=m.url}res()};im.onerror=rej;im.src=m.url;return}
  const el=document.createElement(m.kind==='audio'?'audio':'video');el.muted=true;el.playsInline=true;el.setAttribute('playsinline','');el.setAttribute('webkit-playsinline','');el.preload='auto';POOL.appendChild(el);
  let done=false,t2=null;
  const fin=(ok,err)=>{if(done)return;done=true;clearTimeout(to);clearTimeout(t2);try{el.pause()}catch(_){}el.removeAttribute('src');try{el.load()}catch(_){}el.remove();ok?res():rej(err)};
  const to=setTimeout(()=>{if(durHint&&m.dur){fin(true)}else fin(false,new Error('timeout'))},20000);
  el.onerror=()=>fin(false,new Error('decode'));
  const after=()=>{
    m.dur=isFinite(el.duration)&&el.duration>0?el.duration:(durHint||10);
    if(m.kind==='video'&&!el.videoWidth&&!el.videoHeight)m.kind='audio';
    if(m.kind==='audio'){fin(true);return}
    m.w=el.videoWidth;m.h=el.videoHeight;
    t2=setTimeout(()=>fin(true),5000);
    el.onseeked=()=>{try{if(el.videoWidth){const c=document.createElement('canvas');c.width=160;c.height=Math.round(160*(el.videoHeight/el.videoWidth));c.getContext('2d').drawImage(el,0,0,c.width,c.height);m.thumb=c.toDataURL('image/jpeg',0.7);m.w=el.videoWidth;m.h=el.videoHeight}}catch(_){}fin(true)};
    const go=()=>{el.currentTime=Math.min(1,m.dur/3)};
    try{const p=el.play();if(p&&p.then)p.then(()=>{el.pause();go()}).catch(go);else go()}catch(_){go()}
  };
  el.onloadedmetadata=()=>{
    if(!isFinite(el.duration)){m.dur=durHint||0;el.ondurationchange=()=>{if(isFinite(el.duration)&&el.duration>0){el.ondurationchange=null;el.onseeked=null;el.currentTime=0;after()}};el.onseeked=null;try{el.currentTime=1e101}catch(_){after()}return}
    after()};
  el.src=m.url;try{el.load()}catch(_){}
})}
const analyzeLimit=()=>isPhone()?90e6:350e6;
async function analyze(m){
  if(m.kind==='image'||!m.file||m.rms||m.file.size>analyzeLimit())return;
  try{DEC=DEC||new (window.AudioContext||window.webkitAudioContext)();const buf=await m.file.arrayBuffer();
    const ab=await new Promise((res,rej)=>{const p=DEC.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});
    const rate=100,win=Math.floor(ab.sampleRate/rate),n=Math.floor(ab.length/win),out=new Float32Array(n);const chs=[];for(let i=0;i<ab.numberOfChannels;i++)chs.push(ab.getChannelData(i));
    let mx=0;for(let i=0;i<n;i++){let s=0;const o=i*win;for(let j=0;j<win;j+=2){let v=0;for(const ch of chs)v+=ch[o+j];v/=chs.length;s+=v*v}const r=Math.sqrt(s/(win/2));out[i]=r;if(r>mx)mx=r}

async function loadLogo(f){try{const url=URL.createObjectURL(f);const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
  const k=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);

/* ================= subtitles ================= */
function subs(){return S.clips.filter(c=>c.track==='S1').sort((a,b)=>a.start-b.start)}
function addSubLine(){const c=newClip({track:'S1',kind:'text',start:S.t,in:0,out:2,props:{x:0,y:0.4,scale:1,rot:0,opacity:1},text:subStyle('')});commit();S.clips.push(c);renderTimeline();renderMedia();dirty=true;setTimeout(()=>{const ta=document.getElementById('sub-'+c.id);if(ta)ta.focus()},30)}
function parseTime(s){const m=s.trim().replace(',','.').match(/(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)/);if(!m)return 0;return(+(m[1]||0))*3600+(+m[2])*60+(+m[3])}
function importSRT(text){const blocks=text.replace(/\r/g,'').split(/\n\n+/);let n=0;commit();
  for(const b of blocks){const lines=b.split('\n').filter(Boolean);const i=lines.findIndex(l=>l.includes('-->'));if(i<0)continue;const[a,z]=lines[i].split('-->');const st=parseTime(a),en=parseTime(z);const tx=lines.slice(i+1).join('\n').replace(/<[^>]+>/g,'');if(en<=st)continue;
    S.clips.push(newClip({track:'S1',kind:'text',start:st,in:0,out:en-st,props:{x:0,y:0.4,scale:1,rot:0,opacity:1},text:subStyle(tx)}));n++}
  renderTimeline();renderMedia();dirty=true;toast(n?`${n} altyazı satırı eklendi`:'Dosyada altyazı bulunamadı')}
function srtTime(t){const ms=Math.round(t*1000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60,r=ms%1000;const p=(n,l=2)=>String(n).padStart(l,'0');return`${p(h)}:${p(m)}:${p(s)},${p(r,3)}`}
function buildSRT(){return subs().map((c,i)=>`${i+1}\n${srtTime(c.start)} --> ${srtTime(cend(c))}\n${c.text.content}`).join('\n\n')+'\n'}

function rng(id,label,k,min,max,step,val,kf,fmt){const f=FMT[fmt]||(v=>(+v).toFixed(step<1?2:0));return`<div class="fld${kf?'':' nk'}"><label for="${id}">${label}</label><input type="range" id="${id}" data-k="${k}"${fmt?` data-fmt="${fmt}"`:''} min="${min}" max="${max}" step="${step}" value="${val}"><span class="v" id="${id}-v">${f(val)}</span>${kf?`<button class="kf${kf.on?' on':''}" data-kf="${kf.p}" aria-label="Anahtar kare" title="Bu anda anahtar kare ekle/kaldır">${ic('dia')}</button>`:''}</div>`}
function selRow(id,label,k,opts,val){return`<div class="row2"><label for="${id}">${label}</label><select id="${id}" data-k="${k}">${Object.entries(opts).map(([v,l])=>`<option value="${v}"${v==val?' selected':''}>${l}</option>`).join('')}</select></div>`}
function colRow(id,label,k,val){return`<div class="row2"><label for="${id}">${label}</label><input type="color" id="${id}" data-k="${k}" value="${val}"></div>`}
function chk(id,label,k,val){return`<label class="sw" for="${id}"><input type="checkbox" id="${id}" data-k="${k}"${val?' checked':''}>${label}</label>`}
function segBtns(attr,opts,cur){return `<div class="seg">${opts.map(([v,l])=>`<button data-${attr}="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</div>`}
function fxStack(c){return c.fxl.length?c.fxl.map((e,i)=>`<div class="fld"><label for="i-fxl${i}">${esc(FX[e.t]?FX[e.t].n:e.t)}</label><input type="range" id="i-fxl${i}" data-k="fxl.${i}.a" data-fmt="p0" min="0" max="100" step="1" value="${e.a}"><span class="v" id="i-fxl${i}-v">${Math.round(e.a)}%</span><button class="kf" data-fxdel="${i}" aria-label="Efekti kaldır">${ic('x')}</button></div>`).join(''):'<div class="note">Henüz efekt yok.</div>'}
function trGroup(c,which){const tt=which==='in'?c.tin:c.tout;const id=which==='in'?'tin':'tout';
  return `<div class="grp"><h4>${which==='in'?'Giriş geçişi':'Çıkış geçişi'}</h4><div class="row2"><label>Tür</label><button class="btn" data-trpick="${which}">${esc(trName(tt.type))} ▾</button></div>
  ${tt.type!=='none'?rng('i-'+id+'d','Süre',id+'.dur',0.1,2,0.05,tt.dur,null,'s2'):''}
  ${which==='in'&&tt.type!=='none'&&overlapIn(c)>0?'<div class="note">Önceki klibin üzerine geçer.</div>':''}
  ${which==='in'&&c.track==='V1'&&tt.type!=='none'?'<div class="seg"><button data-act="tinAll">Ana izdeki tüm kesimlere uygula</button></div>':''}</div>`}
function openPicker(kind,cur,onPick){const REG=kind==='fx'?FX:TR,CATS=kind==='fx'?FXC:TRC;let cat=(REG[cur]&&REG[cur].c)||Object.keys(CATS)[0];
  const ov=modal(`<h3>${kind==='fx'?'Efekt ekle':'Geçiş seç'}</h3><div class="chips" data-chips="1"></div><div class="pgrid" data-grid="1"></div><div class="mbtns">${kind==='tr'?'<button class="btn" data-pk="none">Geçiş yok</button>':''}<button class="btn pri" data-pkx="1">${kind==='tr'?'Tamam':'Kapat'}</button></div>`,true);
  const draw=()=>{ov.querySelector('[data-chips]').innerHTML=Object.entries(CATS).map(([k,l])=>`<button class="chip${k===cat?' on':''}" data-cat="${k}">${l} <small>${Object.values(REG).filter(x=>x.c===k&&!x.h).length}</small></button>`).join('');
    ov.querySelector('[data-grid]').innerHTML=Object.entries(REG).filter(([,x])=>x.c===cat&&!x.h).map(([id,x])=>`<button class="pbtn${id===cur?' on':''}" data-pk="${id}">${esc(x.n)}</button>`).join('')};
  draw();
  ov.addEventListener('click',e=>{const c2=e.target.closest('[data-cat]');if(c2){cat=c2.dataset.cat;draw();return}const b=e.target.closest('[data-pk]');if(b){cur=b.dataset.pk;onPick(cur);if(kind==='fx')ov.remove();else draw();return}if(e.target.closest('[data-pkx]'))ov.remove()});
  return ov}
function fxCatalog(cat,attr){return `<div class="chips">${Object.entries(attr==='fxlib'?FXC:TRC).map(([k,l])=>`<button class="chip${k===cat?' on':''}" data-${attr}cat="${k}">${l}</button>`).join('')}</div>
  <div class="pgrid">${Object.entries(attr==='fxlib'?FX:TR).filter(([,x])=>x.c===cat&&!x.h).map(([id,x])=>`<button class="pbtn" data-${attr}="${id}">${esc(x.n)}</button>`).join('')}</div>`}
const fxTarget=()=>{const c=S.sel&&clipById(S.sel);return c&&(isVisual(c)||c.kind==='adjust')?c:null};
function trTarget(){const c=S.sel&&clipById(S.sel);if(c&&ckind(c)!=='audio'&&c.kind!=='adjust')return c;const cs=S.clips.filter(x=>x.track==='V1');if(!cs.length)return null;return cs.reduce((b,x)=>Math.abs(x.start-S.t)<Math.abs(b.start-S.t)?x:b)}
function ensureFxTrack(){if(!trk('FX')){const i=S.tracks.findIndex(t=>t.kind==='video');S.tracks.splice(i<0?0:i,0,{id:'FX',kind:'video',fxt:true,name:'Efekt',hidden:false,muted:false})}}
function applyFxLib(id){const F=FX[id];if(!F)return;const tg=fxTarget();commit();let c;
  if(tg){c=tg;c.fxl.push({id:uid(),t:id,a:F.d||70});toast(`${F.n} → ${clipLabel(c)}`)}
  else{if(S.sample)clearSample(true);ensureFxTrack();c=newClip({track:'FX',kind:'adjust',start:S.t,in:0,out:3,fxl:[{id:uid(),t:id,a:F.d||70}]});S.clips.push(c);S.sel=c.id;S.itab='efekt';toast(`${F.n} efekt klibi olarak eklendi`)}
  renderTimeline();renderInspector();renderMedia();dirty=true;closeSheets();const st=Math.max(c.start,Math.min(S.t,cend(c)-0.5));previewRange(st,Math.min(cend(c),st+2))}
function applyTrLib(id){const c=trTarget();if(!c){toast('Önce zaman çizelgesine bir klip ekle');return}commit();c.tin={type:id,dur:S.trDur};S.lastTr=id;S.sel=c.id;S.itab=null;renderTimeline();renderInspector();renderMedia();dirty=true;closeSheets();previewTr(c,'in');toast(`${TR[id].n} → ${clipLabel(c)}`)}
function tabsFor(c){const k=ckind(c);if(c.kind==='text')return[['yazi','Yazı'],['duzen','Düzen'],['efekt','Geçiş']];if(c.kind==='shape')return[['sekil','Şekil'],['duzen','Düzen'],['efekt','Geçiş']];
  if(k==='adjust')return[['efekt','Efekt']];if(k==='audio')return[['ses','Ses']];if(k==='video')return[['duzen','Düzen'],['renk','Renk'],['efekt','Efekt'],['ses','Ses']];return[['duzen','Düzen'],['renk','Renk'],['efekt','Efekt']]}
function renderInspector(){
  const w=$('#inspWrap');const c=S.sel&&clipById(S.sel);
  if(!c){$('#inspTitle').textContent='Proje';w.innerHTML=`<div class="ih"><span class="chip">Proje</span><b>${esc(S.settings.name)}</b></div><div class="pbody">${projectPanel()}</div>`;return}
  const tabs=tabsFor(c);if(!S.itab||!tabs.some(t=>t[0]===S.itab))S.itab=tabs[0][0];
  const k=ckind(c),names={video:'Video',image:'Fotoğraf',audio:'Ses',color:'Renk',text:'Yazı',sub:'Altyazı',shape:'Şekil',adjust:'Efekt klibi'};
  $('#inspTitle').textContent=names[k];
  const pb=w.querySelector('.pbody');const sc=pb&&w.dataset.cid===c.id&&w.dataset.tab===S.itab?pb.scrollTop:0;
  w.innerHTML=`<div class="ih"><span class="chip">${names[k]}</span><b>${esc(clipLabel(c))}</b><button class="ib" data-act="desel" aria-label="Seçimi kaldır">${ic('x')}</button></div>
  <div class="tabs">${tabs.map(([id,l])=>`<button class="tab${S.itab===id?' on':''}" data-it="${id}">${l}</button>`).join('')}</div><div class="pbody">${panel(c,S.itab)}</div>`;
  w.dataset.cid=c.id;w.dataset.tab=S.itab;if(sc)w.querySelector('.pbody').scrollTop=sc;
}

  ${chk('p-low','Hafif önizleme (yavaş cihazlarda akıcı oynatma, dışa aktarımı etkilemez)','settings.lowres',st.lowres)}</div>

  <div class="seg"><button data-act="saveProj">Projeyi dosyaya kaydet</button><button data-act="openProj">Proje aç</button></div></div>

function unlockSpeech(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(_){}}
function speak(text){return new Promise(res=>{if(!('speechSynthesis' in window)){setTimeout(res,Math.max(1200,text.length*60));return}
  const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';const v=pickVoice();if(v)u.voice=v;u.rate=ST.rate;let done=false;const fin=()=>{if(!done){done=true;clearTimeout(to);res()}};

  $('#stRec').innerHTML='■ Durdur';const dot=$('#recdot');dot.hidden=false;ST.timer=setInterval(()=>{const s=(performance.now()-ST.t0)/1000;dot.textContent='● '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')},250);

async function openVO(){closeSheets();if(S.playing)pause();
  const ov=modal(`<h3>Seslendirme</h3><div class="note">Kayıt oynatma çubuğunun olduğu yerden (${fmtTC(S.t)}) başlar, video oynarken konuşursun. Yankı olmaması için kulaklık takmanı öneririm.</div>
   <div id="vo-st" class="note"></div><div class="mbtns"><button class="btn" id="vo-x">Kapat</button><label class="btn filebtn" id="vo-native" hidden>${ic('mic')}Telefonla kaydet<input type="file" id="vo-file" accept="audio/*" capture></label><button class="btn rec" id="vo-go" disabled>${ic('mic')}Kaydı başlat</button></div>`);
  const st=ov.querySelector('#vo-st');let stream=null,rec=null,chunks=[],t0=S.t,startedAt=0;
  const cleanup=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
  ov.querySelector('#vo-x').onclick=()=>{if(rec&&rec.state!=='inactive'){rec.onstop=null;rec.stop();pause()}cleanup();ov.remove()};
  ov.querySelector('#vo-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;cleanup();ov.remove();await importFiles([f],{at:t0,track:'A2'})};
  try{if(!navigator.mediaDevices||!window.MediaRecorder)throw 0;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});st.textContent='Mikrofon hazır.';ov.querySelector('#vo-go').disabled=false}
  catch(e){st.textContent='Bu görünüm mikrofona doğrudan erişemiyor. Telefonun ses kaydediciyle kaydedip ekleyebilirsin.';ov.querySelector('#vo-native').hidden=false;return}
  ov.querySelector('#vo-go').onclick=()=>{const b=ov.querySelector('#vo-go');
    if(rec&&rec.state==='recording'){rec.stop();pause();return}
    chunks=[];t0=S.t;rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{const dur=(performance.now()-startedAt)/1000;const type=(rec.mimeType||'audio/webm').split(';')[0];const ext=type.includes('mp4')?'m4a':'webm';cleanup();ov.remove();
      await importFiles([new File([new Blob(chunks,{type})],`Seslendirme ${fmtTC(t0)}.${ext}`,{type})],{at:t0,track:'A2',durHint:dur})};
    rec.start(250);startedAt=performance.now();play();b.innerHTML='■ Kaydı bitir';st.textContent='Kaydediliyor…'};
}

  m.onclick=ev=>{const k=ev.target.dataset.m;if(!k)return;m.remove();
    ({new:resetProject,sample:()=>{if(S.playing)pause();sampleProject();applySettings();fullRender();updUndo()},studio:openStudio,reel:openReel,
      png:()=>{render();cv.toBlob(b=>{if(b)saveFile(safeName(S.settings.name)+'-kare.png',b,'Kare kaydedildi')},'image/png')},
      save:saveProject,open:()=>$('#projIn').click(),proj:()=>{deselect();renderInspector();if(isPhone())openInsp()}}[k]||(()=>{}))()}};
document.addEventListener('click',e=>{const m=$('#menu');if(m&&!m.contains(e.target))m.remove()});
document.addEventListener('change',e=>{const t=e.target;if(!t.classList)return;
  if(t.classList.contains('fpick')){const fs=[...t.files];const take=t.dataset.take==='1';t.value='';closeSheets();if(fs.length)importFiles(fs,take?{take:true,scene:$('#studio')?ST.scene:'Sahne'}:{}).then(()=>{if(take){renderStTakes();S.mtab=$('#studio')?S.mtab:'cekim';renderMedia()}})}

$('#lutIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const c=S.sel&&clipById(S.sel);if(!c)return;
  try{const txt=await f.text();let N=0;const vals=[];for(const line of txt.split(/\r?\n/)){const l=line.trim();if(!l||l[0]==='#')continue;if(l.startsWith('LUT_3D_SIZE')){N=parseInt(l.split(/\s+/)[1]);continue}if(/^[A-Z_]/.test(l))continue;const p=l.split(/\s+/).map(Number);if(p.length===3&&p.every(isFinite))vals.push(...p)}
    if(!N||vals.length<N*N*N*3)throw 0;const id=uid();LUTS[id]={N,data:new Float32Array(vals)};commit();c.lut=id;c.lutName=f.name;renderInspector();dirty=true;toast('LUT uygulandı')}catch(err){toast('LUT okunamadı. 3D .cube dosyası seç.')}};
let dragDepth=0;
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;document.body.classList.add('dropzone-on')}});
addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)document.body.classList.remove('dropzone-on')});
addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
addEventListener('drop',e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();dragDepth=0;document.body.classList.remove('dropzone-on');importFiles(e.dataTransfer.files)});
addEventListener('keydown',e=>{
  if($('#studio')){if(e.code==='Space'&&!e.target.closest('input,textarea,select')){e.preventDefault();stNext()}else if(e.key==='Escape')closeStudio();return}
  if(e.target.closest('input,textarea,select')||S.exporting||$('.ov'))return;const mod=e.ctrlKey||e.metaKey;const key=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(mod&&key==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&key==='y'){e.preventDefault();redo()}
  else if(mod&&key==='d'){e.preventDefault();dupSel()}
  else if(mod)return;
  else if(key==='s'){e.preventDefault();splitAt()}
  else if(key==='f'){e.preventDefault();freezeFrame()}
  else if(key==='m'){e.preventDefault();addMarker()}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel()}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(S.playing)pause();seek(S.t-(e.shiftKey?1:1/FPS))}
  else if(e.key==='ArrowRight'){e.preventDefault();if(S.playing)pause();seek(S.t+(e.shiftKey?1:1/FPS))}
  else if(e.key==='Home')seek(0);else if(e.key==='End')seek(totalDur());
  else if(e.key==='Escape'){closeSheets();deselect()}
});

try{new ResizeObserver(fitStage).observe($('#prev'))}catch(_){}

sampleProject();applySettings();fullRender();updUndo();
requestAnimationFrame(()=>{fitStage();tlScroll.scrollLeft=0});
requestAnimationFrame(frame);
(async()=>{await idbOpen();if(!IDB.db)return;
  try{const bj=await idbGet('kv','brand');if(bj){S.brand=Object.assign(defBrand(),JSON.parse(bj));lastBrand=bj;loadBrandImg();renderMedia()}}catch(_){}
  try{const js=await idbGet('kv','project');if(js){const o=JSON.parse(js);if(o.clips&&o.clips.length){await loadProjectObj(o,true);lastSaved=js;const miss=S.media.filter(m=>!m.url).length;setSaveState('Bu cihaza kaydedildi');toast(miss?`Son proje açıldı. ${miss} dosya yeniden eklenmeli.`:'Son proje açıldı')}}}catch(_){}
  setInterval(autosave,2500);
})();

<script>
"use strict";
/* ================= Titus köprüsü (KesitAPI v1) =================
   Titus aynı kökenden (iframe) çağırır: KesitAPI.catalog(), KesitAPI.state(), KesitAPI.run(ops, files, {onProgress})
   "clip": ana izdeki klibin 1'den başlayan sırası ("all", "last" ya da dizi de olur). */
(()=>{
const ASPECTS=['16:9','9:16','1:1','4:5','21:9'];
const POS={top:-0.32,ust:-0.32,center:0,orta:0,bottom:0.33,alt:0.33,lower:0.3};
const num=(v,d)=>{const n=Number(v);return isFinite(n)?n:d};
const mainClips=()=>S.clips.filter(c=>c.track==='V1').sort((a,b)=>a.start-b.start);
function pick(sel){const m=mainClips();if(sel==null||sel==='all'||sel==='hepsi')return m;if(sel==='last'||sel==='son')return m.slice(-1);if(sel==='first'||sel==='ilk')return m.slice(0,1);
  return (Array.isArray(sel)?sel:[sel]).map(n=>m[Math.round(num(n,0))-1]).filter(Boolean)}
async function waitFor(f,ms=15000){const t0=Date.now();while(!f()&&Date.now()-t0<ms)await wait(150);return f()}
async function mediaOf(ctx,i){i=Math.round(num(i,0));if(ctx.media.has(i))return ctx.media.get(i);const f=ctx.files[i];if(!f)throw new Error(`${i}. dosya verilmedi`);
  const [m]=await importFiles([f],{quiet:true,noAdd:true});if(!m)throw new Error(`${f.name} açılamadı`);ctx.media.set(i,m);return m}
function textClip(o,track='T1'){const tx=newText({content:String(o.content??o.text??''),size:num(o.size,o.sub?42:72),color:o.color||'#ffffff',font:FONTS.some(f=>f[0]===o.font)?o.font:(o.font?S.brand.font:'IBM Plex Sans'),weight:num(o.weight,700),box:!!o.box,anim:o.anim||'fade'});
  const c=newClip({track,kind:'text',start:Math.max(0,num(o.start,0)),in:0,out:Math.max(0.3,num(o.dur,3)),text:o.sub?subStyle(tx.content):tx});
  c.props.y=o.sub?0.4:(POS[o.pos]??num(o.y,0));if(o.x!=null)c.props.x=num(o.x,0);S.clips.push(c);return c}
const H={
  clear(){if(S.playing)pause();S.sample=false;S.clips=[];S.sel=null;S.t=0;S.tracks=defTracks();S.settings=Object.assign(defSettings(),{name:S.settings.name});hist=[];fut=[];cleanEls();applySettings()},
  settings(o,ctx){if(ASPECTS.includes(o.aspect)){S.settings.aspect=o.aspect;ctx.aspectSet=true}if(o.name)S.settings.name=String(o.name).slice(0,60);if(o.bg)S.settings.bg=o.bg;if(o.duck!=null)S.settings.duck=!!o.duck;applySettings()},
  async add(o,ctx){const m=await mediaOf(ctx,o.file);const to=o.to||(m.kind==='audio'?'audio':'main');
    const dur=m.kind==='image'?Math.max(0.5,num(o.dur,4)):m.dur;let a=Math.max(0,num(o.in,0)),b=o.out!=null?Math.min(num(o.out,dur),dur):dur;if(m.kind==='image'){a=0;b=dur}if(b-a<0.1){a=0;b=dur}
    const sp=Math.max(0.25,Math.min(4,num(o.speed,1)));let c;
    if(to==='music'||to==='audio'||m.kind==='audio'){const at=Math.max(0,num(o.at,0)),mus=to!=='audio';
      c=newClip({track:pickAudioTrack(at,at+(b-a),mus?'A1':'A2'),mediaId:m.id,start:at,in:a,out:b,vol:num(o.vol,mus?0.7:1),fadeIn:mus?1:0,fadeOut:mus?2:0});if(mus){S.settings.duck=o.duck!==false;ctx.music=c}}
    else if(to==='over'){c=newClip({track:'V2',mediaId:m.id,start:Math.max(0,num(o.at,0)),in:a,out:b,speed:sp,fit:'fit',props:{x:0.22,y:-0.22,scale:0.42,rot:0,opacity:1},frame:{shape:'rect',radius:12,border:3,borderColor:'#ffffff',shadow:true}})}
    else{if(m.kind==='video'&&m.w&&m.h&&!ctx.aspectSet&&!mainClips().some(x=>x.kind==='media'))autoAspect(m);
      c=newClip({track:'V1',mediaId:m.id,start:mainEnd()+0.001,in:a,out:b,speed:sp,fit:o.fit==='fit'?'fit':o.fit==='blur'?'blur':'fill',vol:num(o.vol,1)})}
    S.clips.push(c);pack('V1');ctx.log.push(`+ ${m.name}${to!=='main'?' ('+to+')':''}`);return c},
  card(o,ctx){const dur=Math.max(0.8,num(o.dur,2.5));const c=newClip({track:'V1',kind:'color',start:o.at==='start'||o.at==='bas'?-0.001:mainEnd()+0.001,in:0,out:dur,fill:{c1:o.c1||'#111318',c2:o.c2||S.brand.color||'#2b2f36'},col:{bri:0,con:0,sat:0,hue:0,temp:0,vig:30,look:'none'},tin:{type:'cross',dur:0.4}});
    S.clips.push(c);pack('V1');const t=textClip({content:o.text||o.content||'',size:num(o.size,96),font:o.font||S.brand.font,dur,pos:o.sub?'center':'center',anim:'pop'});ctx.links.push({clip:c,el:t,off:0,fit:true});
    if(o.sub){const s2=textClip({content:o.sub,size:40,weight:500,dur,y:0.16});ctx.links.push({clip:c,el:s2,off:0.2,fit:true})}ctx.log.push(`kart: ${o.text||''}`)},
  text(o,ctx){const t=textClip(o);if(o.clip!=null){const [c]=pick(o.clip);if(c)ctx.links.push({clip:c,el:t,off:Math.max(0,num(o.offset??o.start,0)),fit:o.dur==null})}},
  sub(o,ctx){const t=textClip(Object.assign({},o,{sub:true}),'S1');if(o.clip!=null){const [c]=pick(o.clip);if(c)ctx.links.push({clip:c,el:t,off:Math.max(0,num(o.offset??o.start,0.2)),fit:o.dur==null})}},
  transition(o){const id=TR[o.type]?o.type:'cross';const d=Math.max(0.15,Math.min(2,num(o.dur,0.6)));let cs=pick(o.clip);if(o.clip==null||o.clip==='all')cs=cs.slice(1);cs.forEach(c=>{c.tin={type:id,dur:d}})},
  effect(o,ctx){const id=FX[o.type]?o.type:null;if(!id)throw new Error(`efekt yok: ${o.type}`);const a=Math.max(5,Math.min(100,num(o.amount,FX[id].d||70)));
    if(o.clip!=null){pick(o.clip).forEach(c=>c.fxl.push({id:uid(),t:id,a}))}else{ensureFxTrack();S.clips.push(newClip({track:'FX',kind:'adjust',start:Math.max(0,num(o.start,0)),in:0,out:Math.max(0.3,num(o.dur,3)),fxl:[{id:uid(),t:id,a}]}))}},
  look(o){const l=LOOKS[o.look]?o.look:'none';pick(o.clip).forEach(c=>{c.col.look=l})},
  color(o){pick(o.clip).forEach(c=>{for(const k of ['bri','con','sat','hue','temp','vig'])if(o[k]!=null)c.col[k]=Math.max(-100,Math.min(100,num(o[k],0)))})},
  speed(o){pick(o.clip).forEach(c=>{c.speed=Math.max(0.25,Math.min(4,num(o.speed,1)))});pack('V1')},
  volume(o){if(o.track==='music'){S.clips.filter(c=>trk(c.track)?.music).forEach(c=>c.vol=Math.max(0,Math.min(2,num(o.vol,0.6))));return}pick(o.clip).forEach(c=>{c.vol=Math.max(0,Math.min(2,num(o.vol,1)))})},
  mute(o){pick(o.clip).forEach(c=>{c.vol=0})},
  trim(o){pick(o.clip).forEach(c=>{const m=med(c.mediaId);const max=m&&m.kind!=='image'?m.dur:Infinity;const a=Math.max(0,num(o.in,c.in)),b=Math.min(max,num(o.out,c.out));if(b-a>0.1){c.in=a;c.out=b}});pack('V1')},
  fade(o){pick(o.clip).forEach(c=>{if(o.in!=null)c.fadeIn=Math.max(0,num(o.in,0));if(o.out!=null)c.fadeOut=Math.max(0,num(o.out,0))})},
  kenburns(o){pick(o.clip).forEach(c=>kenBurns(c,['in','out','left','right','up','down'].includes(o.type)?o.type:'in'))},
  async cutSilence(o,ctx){for(const c of pick(o.clip)){const m=med(c.mediaId);if(!m||m.kind!=='video'&&m.kind!=='audio')continue;await waitFor(()=>m.rms||m.noAudio);if(m.rms)cutSilence(c)}pack('V1');ctx.log.push('sessizlikler kesildi')},
  async beatCut(o,ctx){const mc=ctx.music||S.clips.find(c=>trk(c.track)?.music);if(!mc)throw new Error('ritim için önce müzik ekle');const m=med(mc.mediaId);await waitFor(()=>m.rms||m.noAudio);if(!m.rms)throw new Error('müzik çözümlenemedi');findBeats(mc);cutToBeats(Math.max(1,Math.round(num(o.n,2))));ctx.log.push('ritme göre kesildi')},
  template(o,ctx){ctx.later.push(()=>{if(!TPLS.some(t=>t.id===o.id))throw new Error(`şablon yok: ${o.id}`);S.t=o.at==='end'||o.at==='son'?mainEnd():0;applyTpl(o.id)})},
  brand(o){for(const k of ['name','color','font'])if(o[k])S.brand[k]=o[k];if(o.watermark!=null)S.brand.watermark=!!o.watermark},
  export(o,ctx){ctx.exportRes=num(o.res,1920)>=1920?1920:1280}
};
async function exportBlob(res,onP){const mime=pickMime();if(!mime)throw new Error('Bu cihaz videoyu kaydedemiyor');if(totalDur()<=0)throw new Error('Zaman çizelgesi boş');
  if(S.playing)pause();ensureAudio();await waitFor(()=>S.media.every(m=>!m.url||m.dur>0),8000);
  EX.cancel=false;EX.steps=1;EX.step=0;EX.bar={style:{}};const tm=setInterval(()=>{try{onP&&onP(Math.min(1,S.t/Math.max(0.01,totalDur())))}catch(_){}},400);let blob=null;
  try{blob=await recordOnce(res,mime)}finally{clearInterval(tm);exportRes=null;S.exporting=false;setCanvasSize();updTag();EX.bar=null}
  if(!blob||!blob.size)throw new Error('Dışa aktarım boş çıktı');return{blob,ext:mime.includes('mp4')?'mp4':'webm',dur:totalDur(),name:safeName(S.settings.name)}}
async function run(ops,files=[],opt={}){
  if(!Array.isArray(ops))throw new Error('ops bir liste olmalı');if(S.sample)clearSample(true);if(S.exporting)throw new Error('Kesit şu an dışa aktarıyor');
  commit();const ctx={files:[...(files||[])],media:new Map(),links:[],later:[],log:[],errors:[],music:null,aspectSet:false,exportRes:opt.export||null};
  for(const [i,o] of ops.entries()){const f=H[o&&o.op];if(!f){ctx.errors.push(`${i+1}. bilinmeyen işlem: ${o&&o.op}`);continue}
    try{opt.onStep&&opt.onStep(`${i+1}/${ops.length} ${o.op}`);await f(o,ctx)}catch(e){ctx.errors.push(`${i+1}. ${o.op}: ${e.message||e}`)}}
  for(const fn of ctx.later){try{fn()}catch(e){ctx.errors.push(e.message||String(e))}}
  pack('V1');

  looks:Object.entries(LOOKS).map(([id,l])=>[id,l[0]]),templates:TPLS.map(t=>[t.id,t.name]),fonts:FONTS.map(f=>f[0]),kenburns:['in','out','left','right','up','down']}}
